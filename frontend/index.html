<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compensation Planning</title>
    <link rel="stylesheet" href="/styles.css?v=8" />
  </head>
  <body>
    <div class="chat-app">
      <header class="chat-top">
        <h1>Compensation Planning</h1>
      </header>
      <div id="thread" class="thread" aria-live="polite"></div>
      <footer class="composer">
        <div id="chips" class="chips"></div>
        <form id="composerForm" class="composer-form">
          <input id="fileInput" type="file" accept=".xlsx,.xlsm" hidden />
          <button type="button" class="icon-btn" id="attachBtn" title="Attach Excel">+</button>
          <input
            id="composerInput"
            type="text"
            autocomplete="off"
            placeholder="Upload Excel, enter IDs like 1001, 1002, or type report / budget"
          />
          <button type="submit" class="send-btn">Send</button>
        </form>
      </footer>
    </div>
    <script src="/phrases.js?v=1"></script>
    <script src="/faq.js?v=5"></script>
    <script src="/app.js?v=16"></script>
  </body>
</html>
